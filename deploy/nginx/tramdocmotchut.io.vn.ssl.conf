server {
    listen 80;
    listen [::]:80;
    server_name tramdocmotchut.io.vn www.tramdocmotchut.io.vn;

    return 301 https://tramdocmotchut.io.vn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tramdocmotchut.io.vn;

    ssl_certificate /etc/letsencrypt/live/tramdocmotchut.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tramdocmotchut.io.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://tramdocmotchut.io.vn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tramdocmotchut.io.vn;

    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/tramdocmotchut.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tramdocmotchut.io.vn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
